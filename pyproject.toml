[project]
name = "openclaw-personal-ai-briefing"
version = "1.0.0"
description = "A personal primary-source AI briefing skill for OpenClaw."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
